name: BE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Spring Boot Gradle project
        id: app
        shell: bash
        run: |
          if [ ! -f gradlew ] && [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::notice::Backend source has not been added yet; Gradle checks are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f gradlew ] || { [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; }; then
            echo "::error::Commit the Gradle wrapper and build.gradle or build.gradle.kts together."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.app.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.app.outputs.ready == 'true'

      - name: Test and package
        if: steps.app.outputs.ready == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test bootJar
