name: BE production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: be-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        with:
          name: boothfit-be-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boothfit-be-jar
          path: build/libs
      - name: Check deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY_URL EC2_INSTANCE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set in repository Actions variables"
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          image="$ECR_REPOSITORY_URL:$GITHUB_SHA"
          repository="${ECR_REPOSITORY_URL##*/}"
          if aws ecr describe-images --repository-name "$repository" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image already exists for this commit; reusing it"
          else
            docker build --tag "$image" .
            docker push "$image"
          fi
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          script_base64="$(base64 -w 0 deploy/deploy.sh)"
          command="printf '%s' '$script_base64' | base64 -d > /opt/boothfit/deploy.sh && chmod 700 /opt/boothfit/deploy.sh && /opt/boothfit/deploy.sh '$IMAGE_URI'"
          parameters="$(jq -nc --arg command "$command" '{commands: [$command], executionTimeout: ["600"]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"

          status="Pending"
          for attempt in {1..90}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true
          if [ "$status" != "Success" ]; then
            echo "::error::Deployment failed or timed out: $status"
            exit 1
          fi
